) !important; }.via-violet-400\/70 { --tw-gradient-to: rgba(45, 212, 191, 0) !important; --tw-gradient-stops: var(--tw-gradient-from), rgba(45, 212, 191, 0.7), var(--tw-gradient-to) !important;}/* Raw arbitrary values: ambient glows + timeline dot ring */[class*="radial-gradient"] { background-image: radial-gradient(circle at top, rgba(13, 148, 136, 0.18), transparent 42%) !important;}.dark [class*="radial-gradient"] { background-image: radial-gradient(circle at top, rgba(20, 184, 166, 0.24), transparent 42%) !important;}.pulse-release-summary__dot { box-shadow: 0 0 0 5px rgba(20, 184, 166, 0.12) !important; }.dark .pulse-release-summary__dot { box-shadow: 0 0 0 5px rgba(20, 184, 166, 0.20) !important; }/* Code blocks: hold size down and keep inline-code chips out of <pre> */.release-styles pre code { font-size: 0.9375rem; background-color: transparent; color: inherit; border-radius: 0; padding: 0;} </style> <script> window.context = { project: { name: "DealMachine", logo: "https://release-assets.s3.amazonaws.com/profiles/SXuto7zV2tiyayUgZDfidBdl1TlcVsgxcHjiH2qN.png", darkLogo: "https://release-assets.s3.amazonaws.com/profiles/Kz1brroNtbIpb9XHL7p4Cir0bkaOJcGTB6Rli3xY.png", allowSubscribers: false, team: [ { name: "David Lecko", avatar: "", link: "https://www.gravatar.com/avatar/9d8903f1b8f8cf67c5bdb9f1b44f5c63.jpg?s=200&amp;d=mm" }, { name: "Dave Oster", avatar: "", link: "https://release-assets.s3.amazonaws.com/profiles/amxud28vmuvhpiyz9UHFSerU5sThhcyz4SCQTyK8.jpeg" }, { name: "Nate Dunlevy", avatar: "", link: "https://www.gravatar.com/avatar/e22e32b2aac1de72916355d4aa5ad6fa.jpg?s=200&amp;d=mm" }, { name: "Hannah", avatar: "", link: "https://www.gravatar.com/avatar/d7ff85f1f65006950661ac035d353e46.jpg?s=200&amp;d=mm" }, { name: "Dan Regan", avatar: "", link: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png" }, ] }, loggedIn: false, ssoUrl: "", error: "",releases: [{ uid: "ZFTad", title: "9\/22\/2026 16.4.0 Release", type: "update", link: "https://updates.dealmachine.com/release/ZFTad-9222026-1640-release", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<p>Since the new DealMachine launched in July, many of you have told us that some everyday work got harder. The map was harder to reach, getting from a property to an action took too many steps, and too much of what you need in the field only lived on the web. We took that feedback to heart, and this release addresses a lot of what we heard.<\/p>\n<p>DealMachine releases new features and fixes every two weeks. Here is what we released on 9\/22\/26 in our 16.4.0 release. Mobile updates arrive as soon as the App Store and Google Play approve them.<\/p>\n<h2 dir=\"ltr\">Member-Facing Features and Changes<\/h2>\n<h3 dir=\"ltr\">On the web<\/h3>\n<p dir=\"ltr\"><strong>A Map-First Way to Search<\/strong><br>Explore Map now has its own place in the left navigation and a button on the home page. Zoom in to see individual properties, click one for a preview card with Street View and estimated value, and use Search this area as you pan. A results grid can pop out beside the map. The search box suggests addresses, people, and locations as you type, and each filter you apply shows as a chip you can remove with a click.<\/p>\n<p dir=\"ltr\"><strong>Saved Properties and Targets Are Now Prospects<\/strong><br>Saved Properties are now called Prospects, and properties targeted while driving are prospects too. If you're a Classic DealMachine user, this is your \"Leads menu.\" Add Prospect is on the property page, the person page, and the map preview card and mobile app making it easier to save the records most important to you. The new Prospects page lets you search, narrow by list, favorite, and archive the ones you're finished working.<\/p>\n<p dir=\"ltr\"><strong>Lists on the Property and Person Page<\/strong><br>Property and person pages now show how many lists a record is on. Click the list icon to see them, jump to one, or remove the record.<\/p>\n<h3 dir=\"ltr\">In the mobile app<\/h3>\n<p dir=\"ltr\"><strong>A New Home Screen and Map<\/strong><br>The app opens to a map-centered home screen with one search bar for addresses or plain-English questions. The map shows your prospects, your past drive routes and your team's, and satellite imagery. A new sidebar menu puts every part of the app in one place.<\/p>\n<p dir=\"ltr\"><strong>Full Property and Person Pages<\/strong><br>Property pages now match the depth of the web. They include Comparables and Location, insights and sections you can customize, the lists the property is on, and an activity feed for notes and photos. You can now add photos from your photo library.<\/p>\n<p dir=\"ltr\"><strong>Search, Lists, and Bulk Actions<\/strong><br>Find Properties and Find People use the same filters as the web. Build List turns the filtered properties on the map into a list in one tap, and a full Lists screen lets you browse and manage your lists. Long-press to select properties, then add them as prospects, add them to a list, export them, or send mail.<\/p>\n<p dir=\"ltr\"><strong>Send Mail from Your Phone<\/strong><br>Send one-off mail from a property page or a selection of properties. Pick a design, choose the owner or the current resident, and see the total before you send. The Direct Mail section also shows your campaigns, designs, and results.<\/p>\n<p dir=\"ltr\"><strong>Driving for Dollars<\/strong><br>Tap-to-Add is back. Turn it on in Settings &gt; Driving, and one tap adds a house as a prospect. A single setup screen lets you set a goal, check your filters, and choose the lists your prospects go to, and your route keeps recording while your phone is locked. Drive history shows your drives and your team's, with a replay of each route.<\/p>\n<h3 dir=\"ltr\">API<\/h3>\n<p dir=\"ltr\"><strong>Phone Carrier<\/strong><br>Phone numbers returned by the DealMachine API and CLI now include the carrier. It matches the Phone Carrier field in Contact List and Phone List exports.<\/p>\n<h2>Bug Fixes &amp; Improvements<\/h2>\n<p dir=\"ltr\"><strong>Last Exported Filter<\/strong><br>Records exported through the API weren't picked up by the Last Exported filter, which could return zero properties even while the property page showed them as exported. The filter and the property page now count exports the same way, whether they came from the web, AI Chat, Classic, or the API.<\/p>\n<p dir=\"ltr\"><strong>Mail API Access<\/strong><br>Every Mail API request came back with a <code>mail_not_enabled<\/code> error, and the setting our docs pointed to for turning it on didn't exist. Mail API access now follows the Direct Mail app: if Direct Mail is on for your organization, the API works.<\/p>\n<p dir=\"ltr\"><strong>Building Lists Through the API<\/strong><br>A list built through the API with a ZIP code or other location returned properties from across the entire country, and any filters were dropped. Locations and filters now apply as sent, and a malformed request returns an error naming the field instead of a nationwide list.<\/p>\n<p dir=\"ltr\"><a href=\"https:\/\/dealmachine.featureupvote.com\/\">Keep telling us what you think<\/a>, we are listening.<\/p>", released_at: "September 22nd, 2026", released_at_human: "2 weeks ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},{ uid: "ZufnE", title: "9\/8\/2026 16.3.0 Release", type: "update", link: "https://updates.dealmachine.com/release/ZufnE-982026-1630-release", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<p>DealMachine releases new features and fixes every two weeks. Here is what we released on 9\/8\/26 in our 16.3.0 release:<\/p>\n<h3>Member-Facing Features and Changes<\/h3>\n<p><strong>Estimated Repair Cost<\/strong> Residential properties now carry an Estimated Repair Cost, calculated from the property's condition and building square footage. You can see it on the property page, filter your searches by a min\/max range to find deals that fit your rehab budget, and include it as a field in your exports.<\/p>\n<p><strong>Filter Out HOA Properties<\/strong> The \"Part of an HOA?\" filter now offers a <strong>No<\/strong> option alongside Yes, so you can build lists that exclude HOA-governed properties instead of only including them. Properties with no HOA data on file are treated as not part of an HOA.<\/p>\n<p><strong>Phone Carrier at Export<\/strong> Contact List and Phone List exports now offer a Phone Carrier field, listed under Phone Numbers alongside Do Not Call Flags and Phone Type. Check it and every exported number arrives with its carrier &mdash; AT&amp;T, Verizon, T-Mobile so you can match your outreach to carrier deliverability. Numbers with no carrier on file export blank.<\/p>\n<p><strong>APN and Coordinates Included at No Extra Cost<\/strong> Parcel number (APN) and latitude\/longitude now come back with the standard address fields in your exports, and no longer count as extra data fields against your Data Credits. If you imported a list by APN, the APN comes back with it so you can join the export to your own records and check our address matching without paying for the identifiers twice.<\/p>\n<h3>Bug Fixes &amp; Improvements<\/h3>\n<p><strong>Comps for Vacant Land and Unknown Property Types<\/strong> Selecting Vacant Land as your only property type in Comps returned single family homes, and some properties came back with zero comps no matter how wide you set the criteria. Your selections now run against the criteria you actually chose. The comps filter windows were also cleaned up so it's clear at a glance which options are selected.<\/p>\n<p><strong>Scheduled and Follow-Up Mail<\/strong> Mail scheduled to start on a future date, along with every follow-up piece in a multi-step or repeating campaign, could fail with an address error. Campaigns sent immediately as a single step were unaffected. Scheduled and follow-up sends now go out as intended.<\/p>\n<p><strong>Reserved Funds on Cancelled Mail Campaigns<\/strong> Cancelling a mail campaign left the value of the unsent pieces sitting under \"reserved for pending sends\" instead of returning to your available balance. Cancelling now releases those funds immediately, only the pieces that already went out stay charged.<\/p>\n<p><strong>Adding More Than 100 Records to a List<\/strong> Adding more than 100 records to a list from your search results left the list in an error state with none of the records added, even though the progress bar showed the add as finished. Larger selections now land in the list as expected.<\/p>\n<p><strong>Export File Names<\/strong> An export could take its name from one list and its records from another, leaving the downloaded file labeled with the wrong list. The file name and its contents now always come from the same list.<\/p>\n<p><strong>Recorded Routes on the Mobile Map<\/strong> Routes you had already driven didn't appear on the map during a new drive, even though they showed on the web map. Your recorded routes are visible again while you drive.<\/p>\n<p><strong>Developer and Apps &amp; Integrations for Team Members<\/strong> The Developer and Apps &amp; Integrations cards in Settings appeared greyed out with a \"Coming soon\" label for team members and couldn't be opened. Both are now available to team members, who can create API keys, enable apps, and see the names of keys their teammates created.<\/p>", released_at: "September 8th, 2026", released_at_human: "4 weeks ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},{ uid: "PnpUR", title: "8\/27\/2026 16.2.0 Release", type: "update", link: "https://updates.dealmachine.com/release/PnpUR-8272026-1620-release", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<p>DealMachine releases new features and fixes every two weeks. Here is what we released on 8\/24\/26 in our 16.2.0 release:<\/p>\n<h3>Member-Facing Features and Changes<\/h3>\n<p><strong>Lot Size in Acres or Square Feet<br><\/strong>The Lot Size filter now has a unit toggle, so you can enter your range in whichever unit you work in. Switching units converts the values you've already entered, saved searches remember your choice, and you can pick the unit for the Lot Size column at export as well.<\/p>\n<p><strong>Four New Land Filters<br><\/strong>We've added four lot-characteristic filters are previously available only in classic to the new interface:&nbsp;<strong>Corner Lot<\/strong>, <strong>Landlocked<\/strong>, <strong>Has Solar<\/strong>, and <strong>Road Frontage (ft)<\/strong>. The first three are Yes\/No; road frontage takes a min\/max range in feet so you can target parcels with the access, positioning, or frontage your strategy calls for instead of checking them one at a time on the map.<\/p>\n<p><strong>Partial Exports Up to Your Limit<br><\/strong>When you select more records than your plan's remaining data credit limit, you can now choose to export up to your limit and save the records that didn't fit as a list, ready to export when your limit resets.<\/p>\n<p><strong>County in Parsed Address Exports<br><\/strong>Choosing the Parsed address format when exporting property addresses now includes county name as its own column alongside street, city, state, and ZIP.<\/p>\n<h3>Bug Fixes &amp; Improvements<\/h3>\n<p><strong>Owner Occupied Exports<br><\/strong>Lists built with the Owner Occupied filter could include absentee-owned records in the exported file, even though filtering that same list for Absentee Owned returned nothing. The export now matches what the filter shows.<\/p>\n<p><strong>Lists from Saved Properties<br><\/strong>Creating a list from your saved properties produced an empty list, and exporting from them counted millions of records instead of the ones you selected. Both now work off the records you actually saved.<\/p>\n<p><strong>Building a List from AI Chat<br><\/strong>A list built from AI Chat search results arrived with zero leads in it, then showed an error when opened. Lists now contain the properties the search returned.<\/p>\n<p><strong>Comparable Property Photos<br><\/strong>Photos on comparable properties stopped loading on the property page. They now load again.<\/p>\n<p><strong>Classic Route Transfers<br><\/strong>Some members completed the move from DealMachine Classic without their routes and lists arriving. Those transfers now go through.<\/p>\n<p><strong>Your Location on the Mobile Map<br><\/strong>The blue current-location dot could sit on an old position and stay there through refreshes and relaunches. The map now follows where you actually are, with no need to start a drive to shake it loose.<\/p>\n<p><strong>Mail Sends Reporting \"No Funds\"<br><\/strong>Mail pieces could fail with a \"No Funds\" message on an account with plenty of balance. Sends no longer fail this way.<\/p>\n<p><strong>API Requests With No Credits Remaining<br><\/strong>Free requests (such as fetching property fields without contact data) were turned away once an account hit its credit limit for the cycle. Free requests now go through regardless of balance.<\/p>\n<p><strong>Mail API Campaign Designs<br><\/strong>A&nbsp;<code>design_id<\/code> sent when creating a campaign step was accepted and then quietly discarded, so the campaign failed at launch with \"at least one step must have a design.\" The design now sticks.<\/p>\n<p><strong>Date Filters Over MCP<br><\/strong>The date operators offered to AI assistants didn't match the ones our API accepts, so date-based searches like last sale date came back empty or errored. Date filters now behave the same through a connected AI assistant as they do in the app.<\/p>", released_at: "August 27th, 2026", released_at_human: "1 month ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},{ uid: "MpB9K", title: "8\/11\/2026 16.1.0 Release", type: "update", link: "https://updates.dealmachine.com/release/MpB9K-8112026-1610-release", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<p>DealMachine releases new features and fixes every two weeks. Here is what we released on 8\/11\/26 in our 16.1.0 release:<\/p>\n<h3>Member-Facing Features and Changes<\/h3>\n<p><strong>Number of Owned Properties Filter<\/strong> &mdash; You can now target owners by portfolio size. In the Ownership category of your property filters, check \"Owns multiple properties\" and set a min\/max range &mdash; say, landlords with 5 to 20 properties &mdash; the same way you could in DealMachine Classic. It combines with all your other filters, and existing saved searches keep working.<\/p>\n<p><strong>More Properties Per Page in Lists<\/strong> &mdash; Lists now offer the same page-size options as your prospect searches, so you can view well more than 50 properties or contacts at a time. Your preferred page size is remembered when you come back.<\/p>\n<p><strong>Higher Unit Count Filters<\/strong> &mdash; The \"Number of Units\" and \"Number of Commercial Units\" sliders now go up to 10,000 (previously 100 and 10), so large multi-family and commercial properties are no longer excluded from your searches.<\/p>\n<h3>Bug Fixes &amp; Improvements<\/h3>\n<p><strong>Lot Size (Acres) Filter<\/strong> &mdash; Fixed an issue where fractional acreage values were rounded to whole numbers before the search ran &mdash; a minimum of 0.25 acres was treated as 0, quietly returning far more properties than your criteria called for. Fractional values are now applied exactly, in both the filters and AI Chat.<\/p>\n<p><strong>Pre-Foreclosure Filter<\/strong> &mdash; Resolved an issue where a pre-foreclosure search could return properties that weren't actually in pre-foreclosure. Results now match the filter.<\/p>\n<p><strong>Export Errors<\/strong> &mdash; Fixed two errors that could stop an export before it started: the \"export failed to start\" error when exporting lists, and the \"counts unavailable\" error.<\/p>\n<p><strong>Contact Export Scrubs<\/strong> &mdash; Fixed an issue where contact exports could include rows with no phone number even after applying DNC and phone-type scrubs. Every exported row now contains a phone number that satisfies the filters you selected.<\/p>\n<p><strong>Export Credit Preview<\/strong> &mdash; Fixed a display issue where the export modal could show zero billable Data Credits after you'd revealed some of the selected contacts. Exports were always charged correctly &mdash; the preview now shows the right count too.<\/p>\n<p><strong>Forgot Password<\/strong> &mdash; Restored the \"Forgot Password\" option on the login page for migrated accounts.<\/p>\n<p><strong>Classic Data Transfers<\/strong> &mdash; Resolved failures that prevented some members' lists and routes from transferring from DealMachine Classic to the new DealMachine. Transfers that previously timed out now retry automatically.<\/p>\n<p><strong>AI Chat Error Messaging<\/strong> &mdash; When an AI Chat search can't complete, you'll now see clearer messaging instead of a generic \"Something went wrong.\"<\/p>\n<p><strong>Senior Owners Tag<\/strong> &mdash; The Senior Owners property tag now displays with a colored border matching the other tags on the property page.<\/p>\n<p><strong>Transaction Type Tooltips<\/strong> &mdash; Transaction types on the property page now have contextual tooltips explaining what each type means.<\/p>", released_at: "August 12th, 2026", released_at_human: "1 month ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},{ uid: "Q2tOZ", title: "16.0.0 Release 7\/27\/2026", type: "update", link: "https://updates.dealmachine.com/release/Q2tOZ-1600-release-7272026", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<h1>This is the biggest release in DealMachine's history.<\/h1>\n<p>We didn't update DealMachine. We rebuilt it. A new web app. A new mobile app built for the driver's seat. An AI that works your data alongside you. And a way to connect your account to the AI tools you already use.<\/p>\n<p>Everything you're about to read went live today.<\/p>\n<h2>Search as many markets as you want<\/h2>\n<p><strong>The location limit is gone.<\/strong> Add as many locations to a search as your strategy calls for, and mix types freely &mdash; everything you add combines into one search area.<\/p>\n<p><strong>States, counties, cities, and ZIP codes.<\/strong> Type the name of the place you work &mdash; \"Indiana,\" \"Naperville,\" \"Orange County\" &mdash; and your results are scoped to its real boundaries.<\/p>\n<p><strong>Or draw it yourself.<\/strong> When a market doesn't line up with any boundary on the map, draw the area by hand and search inside it.<\/p>\n<p>Layer any filter set on top and build the list you meant to build in the first place.<\/p>\n<h2>Premium Filters: go deep, not just wide<\/h2>\n<p>Anyone can filter for pre-foreclosures. <strong>Premium Filters<\/strong> are about what's underneath the category.<\/p>\n<p><strong>39 premium data fields*<\/strong> &mdash; auction dates, opening bids, trustee and case details, mortgage terms, lender information, investment-property signals, and more. Two-thirds of them are financial-intent data: the fields that tell you <em>why<\/em> a property is about to move, not just that it's on a list.<\/p>\n<p>That's the difference between a list of 4,000 pre-foreclosures and a list of 40 with auctions in the next 21 days.<\/p>\n<p><em>*Premium Filters are included with Pro.<\/em><\/p>\n<h2>Exports built to your spec<\/h2>\n<p>The new export wizard puts you in control of exactly who lands in the file and exactly what travels with them.<\/p>\n<p><strong>Choose your list type.<\/strong> Property List, Contact List, Email List, or Phone List. Email and phone lists are included with <strong>Pro<\/strong>, along with expanded contact audiences &mdash; reach <strong>Owners + Family<\/strong>, <strong>Residents<\/strong>, or <strong>Renters<\/strong> instead of just the owner of record.<\/p>\n<p><strong>Filter the contacts before anything leaves.<\/strong> Require a phone number. Require an email address. Take mobile numbers only, or landlines only. Scrub DNC numbers so contacts without a reachable number never make it into the file at all.<\/p>\n<p><strong>Choose your fields.<\/strong> Turn individual data points on and off until the export matches the tool it's headed for &mdash; your dialer, your CRM, your mail house &mdash; instead of a dump you clean up on the other side.<\/p>\n<h2>AI Chat, sitting on top of your data<\/h2>\n<p>Ask for what you want in plain English.<\/p>\n<blockquote>\n<p><em>\"Find absentee owners in Naperville with high equity and no mortgage.\" \"Who owns this property and how do I reach them?\" \"Run comps on this address.\"<\/em><\/p>\n<\/blockquote>\n<p>DealMachine's AI searches properties, looks up people, runs comps, and enriches contacts &mdash; autonomously, using your live data. Attach a specific list, search, or property to the conversation with <strong>@Add Context<\/strong> so it knows exactly what you're working on. Every conversation is saved and picks up right where you left it.<\/p>\n<p>This isn't a chatbot bolted onto a sidebar. It's a research assistant with hands on the product.<\/p>\n<h2>A new mobile app, built for driving for dollars<\/h2>\n<p>The rebuilt DealMachine mobile app is a <strong>driving companion<\/strong> designed for the phone in the mount, not the laptop on the desk.<\/p>\n<p><strong>Free Drive<\/strong> puts you on the road with nothing in your way. Open the app, start driving your market, and tag distressed properties the moment you spot them. Search freely as you go, pull up ownership and contact data on any house on the block, and keep moving.<\/p>\n<p>Everything you capture on the road lands in the same system your web lists, exports, and mail campaigns run on. Drive in the morning, mail in the afternoon.<\/p>\n<h2>Connect DealMachine to the AI you already use<\/h2>\n<p>Looking to empower an AI assistant? Now you can connect it to your DealMachine account.<\/p>\n<p>Ask it to find the absentee owners in a market you're working. Ask who owns an address and how to reach them. Ask it to run comps. It answers from your live DealMachine data, on your account, instead of you stopping to go do it in the app and paste the results back.<\/p>\n<p>To set it up using your AI app, install the DealMachine CLI and sign in:<\/p>\n<pre><code>npm&#32;install&#32;-g&#32;dealmachine\ndm&#32;login<\/code><\/pre>\n<p>You sign in through your browser &mdash; there's no key to copy anywhere. That login is what gives your AI assistant access to your account.<\/p>\n<p>The same tool works on its own, too: search properties, look up people, and pull contact data without opening the app. Documentation at <strong><a href=\"https:\/\/api.docs.dealmachine.com\">api.docs.dealmachine.com<\/a><\/strong>.<\/p>\n<h2>Built for teams<\/h2>\n<p>Rebuilt organization and profile settings, with real role controls. Admins own billing and org configuration. Members manage their own profiles and belong to as many organizations as their work requires &mdash; and switch between them cleanly on web and mobile.<\/p>\n<h2>Mail, connected to everything<\/h2>\n<p>Send postcards and letters in every supported size and orientation, from the same lists you just built.<\/p>\n<p><strong><a href=\"https:\/\/dealmachine.com\/\">Open the new DealMachine &rarr;<\/a><\/strong><\/p>", released_at: "July 28th, 2026", released_at_human: "2 months ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},{ uid: "j39yk", title: "5\/19\/2026 15.5.0 Release", type: "update", link: "https://updates.dealmachine.com/release/j39yk-5192026-1550-release", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\">DealMachine releases new features and fixes every four weeks. Here is what we released on 5\/19\/26 in our 15.5.0 release:<\/p>\n<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\"><strong>Bug Fixes &amp; Improvements<\/strong><\/p>\n<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\"><strong>Real Estate Portfolio Value<\/strong> &mdash; Resolved an issue where the Real Estate Portfolio Value (along with total mortgage balance and equity) could display far higher than expected &mdash; sometimes many times the property's actual estimated value. The figures now reflect each property's most recent valuation instead of stacking older valuation records on top of one another, so portfolio totals are accurate.<\/p>\n<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\"><strong>Import Column Headers<\/strong> &mdash; Fixed an issue where your file's column headers weren't appearing during the mapping step of an import, making it difficult to match columns correctly. Headers now display as expected when you map your file.<\/p>", released_at: "June 2nd, 2026", released_at_human: "4 months ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},{ uid: "2fRnL", title: "4\/21\/2026 15.4.0 Release", type: "update", link: "https://updates.dealmachine.com/release/2fRnL-4212026-1540-release", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\">DealMachine releases new features and fixes every four weeks. Here is what we released on 4\/21\/26 in our 15.4.0 release:<\/p>\n<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\"><strong>Member-Facing Features and Changes<\/strong><\/p>\n<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\"><strong>Dialer Data Export<\/strong> You can now export your Dialer data directly from the Dialer Update tab. Four export options are available &mdash; Follow-up Queue, Incoming Activity, Outgoing Activity, and Dialer Sessions. Exports are delivered as CSV files to your Inbox, so you can retain your historical records and easily migrate your workflow to another tool.<\/p>\n<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\"><strong>Bug Fixes &amp; Improvements<\/strong><\/p>\n<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\"><strong>Inbound Call Tracking<\/strong> Resolved an issue where inbound calls to tracking numbers were going straight to voicemail without ringing, and caller ID was displaying your own DealMachine number instead of the caller's actual number. Inbound calls will now ring as expected with correct caller ID.<\/p>", released_at: "April 21st, 2026", released_at_human: "5 months ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},{ uid: "FPcab", title: "3\/24\/2026 15.3.0 Release", type: "update", link: "https://updates.dealmachine.com/release/FPcab-3242026-1530-release", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<p dir=\"ltr\">DealMachine releases new features and fixes every four weeks. Here is what we released on 3\/24\/26 in our 15.3.0 release:<\/p>\n<h3 dir=\"ltr\">Member-Facing Features and Changes<\/h3>\n<p dir=\"ltr\"><strong>Road Frontage<\/strong><\/p>\n<p dir=\"ltr\">We've added a new field to the property card: Road Frontage. This shows the linear footage of a property's boundary that directly touches a road &mdash; useful for evaluating access, development potential, and land value.<\/p>\n<p dir=\"ltr\"><strong>Property Enrichment API Updates<\/strong><\/p>\n<p dir=\"ltr\">We've made several improvements to our property enrichment API, including the addition of mortgage data, better address matching, and cleaner data formatting across a number of fields.<\/p>\n<h2 dir=\"ltr\">&nbsp;<\/h2>\n<h2 dir=\"ltr\">Bug Fixes &amp; Improvements<\/h2>\n<p dir=\"ltr\"><strong>Dialer Reliability<\/strong><\/p>\n<p dir=\"ltr\">Resolved intermittent connection and login errors some members were experiencing with the DealMachine dialer. Calls should now connect more consistently.<\/p>\n<p dir=\"ltr\">F<strong>ireplace Filter<\/strong><\/p>\n<p dir=\"ltr\">Fixed a bug where applying the Fireplace filter in the list builder caused an error and prevented lists from loading.<br><br><\/p>\n<p>Want us to build something? <a href=\"https:\/\/dealmachine.featureupvote.com\/\">Tell us what you think!<\/a><\/p>", released_at: "March 25th, 2026", released_at_human: "6 months ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},{ uid: "AqD5a", title: "2\/26\/2026 15.2.0 Release", type: "update", link: "https://updates.dealmachine.com/release/AqD5a-2262026-1520-release", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<p dir=\"ltr\">DealMachine releases new features and fixes every four weeks. Here is what we released on 2\/26\/25 in our 15.2.0 release:<\/p>\n<h3 dir=\"ltr\">Member-Facing Features and Changes<\/h3>\n<h4 dir=\"ltr\">Cleaner Leads View<\/h4>\n<p dir=\"ltr\">We've streamlined the Leads view to make it easier to scan and prioritize your pipeline at a glance. Phone numbers and email addresses have been replaced with a single \"Contactability\" count &mdash; showing you how many phones and emails are on file for a property &mdash; so you can quickly gauge reachability without the clutter. When you're ready to reach out, full contact details are just a click away on the property detail page.<\/p>\n<h4 dir=\"ltr\">Improved Contact Linking for LLCs<\/h4>\n<p dir=\"ltr\">We've made improvements to how contacts are linked and unlinked from LLC and company records, ensuring the data is clean and accurate.<\/p>\n<h4 dir=\"ltr\">New Export Fields: Lot Width &amp; Lot Depth<\/h4>\n<p dir=\"ltr\">Your property exports now include two additional land data fields &mdash; Lot Width and Lot Depth &mdash; giving you more granular detail on lot dimensions for deeper investment analysis.<\/p>\n<h4 dir=\"ltr\">Property Enrichment API<\/h4>\n<p dir=\"ltr\">For members using third-party CRMs, a new property enrichment API is now available. Submit an address and get back DealMachine's property and owner data directly in your existing workflow. <a href=\"https:\/\/www.dealmachine.com\/contact-sales\">Talk to our sales team for more information<\/a>.<\/p>\n<p dir=\"ltr\">&nbsp;<\/p>\n<hr>\n<p>&nbsp;<\/p>\n<h2 dir=\"ltr\">Bug Fixes &amp; Improvements<\/h2>\n<h4 dir=\"ltr\">Scheduled Mail Display Fix<\/h4>\n<p dir=\"ltr\">Some users saw their scheduled mail incorrectly showing postcards going to multiple addresses when only one was selected. This was a display issue only &mdash; mail was always sent correctly. The count shown in the Scheduled Mail view has been fixed.<\/p>\n<h4 dir=\"ltr\">Call Tracking Transcripts<\/h4>\n<p dir=\"ltr\">Resolved an issue where inbound calls were logging correctly in the Call Activity feed but not generating transcripts. This has been fixed.<\/p>\n<h4 dir=\"ltr\">Follow-Up Queue: \"Not Interested\" Leads Now Callable<\/h4>\n<p dir=\"ltr\">A bug was preventing \"Not Interested\" leads from being reached during dialer sessions started from the Follow-Up Queue, even when a scheduled callback was due. This has been corrected &mdash; Not Interested leads will now appear in the Follow-Up Queue per your settings, as expected.<br><br><\/p>\n<p dir=\"ltr\"><a href=\"https:\/\/dealmachine.featureupvote.com\/\">Have ideas for DealMachine? Keep us informed on your needs!<\/a><\/p>\n<p>&nbsp;<\/p>", released_at: "February 27th, 2026", released_at_human: "7 months ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},{ uid: "ehUui", title: "1\/27\/2026 15.1.0 Release", type: "update", link: "https://updates.dealmachine.com/release/ehUui-1272026-1510-release", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<p dir=\"ltr\">DealMachine releases new features and fixes every four weeks. Here is what we released on 1\/27\/25 in our 15.1.0 release:<\/p>\n<h3 dir=\"ltr\">Member-Facing Features and Changes<br><br><\/h3>\n<h4 dir=\"ltr\">Corner Lots Filter<\/h4>\n<p dir=\"ltr\">We&rsquo;ve added a new &ldquo;Corner Lots&rdquo; filter to help you target&mdash;or skip&mdash;properties on corners.<br><br><\/p>\n<h4 dir=\"ltr\">Faster Notifications Menu<\/h4>\n<p dir=\"ltr\">The notifications menu now loads quicker by displaying your past two months of activity&mdash;speed you&rsquo;ll notice immediately.<br><br><\/p>\n<h4 dir=\"ltr\">Probate Filter Update<\/h4>\n<p dir=\"ltr\">Our Probate quick filter just got a tune-up. Expect more accurate results in your Probate lists.<br><br><\/p>\n<h3 dir=\"ltr\">Bug Fixes and Performance Improvements<\/h3>\n<p dir=\"ltr\">We&rsquo;ve resolved a few key bugs and sharpened some tools:<\/p>\n<ul>\n<li dir=\"ltr\" aria-level=\"1\">\n<p dir=\"ltr\" role=\"presentation\">Dashboard Mail Template Filter Fixed &ndash; The Mail Template filter on the dashboard now works as intended.<br><br><\/p>\n<\/li>\n<li dir=\"ltr\" aria-level=\"1\">\n<p dir=\"ltr\" role=\"presentation\">Contact Unlinking Issue Resolved &ndash; You can now unlink contacts from properties without any hiccups.<br><br><\/p>\n<\/li>\n<li dir=\"ltr\" aria-level=\"1\">\n<p dir=\"ltr\" role=\"presentation\">Portfolio Property Counts Restored &ndash; Real estate portfolio property counts are back to being spot-on.<br><br><\/p>\n<\/li>\n<\/ul>\n<p dir=\"ltr\"><a href=\"https:\/\/dealmachine.featureupvote.com\/\">Let us know what you think!<\/a><\/p>\n<p>&nbsp;<\/p>", released_at: "January 27th, 2026", released_at_human: "8 months ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]},],pagination: { page: 1, pageCount: 12} }; </script></head><body> <div id="page-html"></div> <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KZ9N2KPC" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript> <script async src="https://www.googletagmanager.com/gtag/js?id=G-3K1WG1CC4G"></script><script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); var path = window.location.pathname; var fullpath = '/dealmachine/' + window.location.hostname + path; var analytics_data = { 'page': fullpath, 'dimension1': 'dealmachine', 'cookie_domain': 'dealmachine.releasenotes.io' }; gtag('set',analytics_data); gtag('config', 'G-3K1WG1CC4G');</script><script> (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','https://www.google-analytics.com/analytics.js','ga'); var path = window.location.pathname; var fullpath = '/dealmachine/' + window.location.hostname + path; var analytics_data = { 'page': fullpath, 'dimension1': 'dealmachine' }; ga('create', 'UA-70779509-2', 'dealmachine.releasenotes.io', 'rn'); ga('rn.set', analytics_data); ga('rn.send', 'pageview');</script><script id="reactions" type="text/x-handlebars-template"> <div x-data="reactions
