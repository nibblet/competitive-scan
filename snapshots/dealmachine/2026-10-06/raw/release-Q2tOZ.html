 into one search area. States, counties, cities, and ZIP codes. Type the name of the place you work — &quot;Indiana,&quot; &quot;Naperville,&quot; &quot;Orange County&quot; — and your results are scoped to its real boundaries. Or draw it yourself. When a market doesn&#039;t line up with any boundary on the map, draw the area by hand and search inside it. Layer any filter set on top and build the list you meant to build in the first place. Premium Filters: go deep, not just wide Anyone can filter for pre-foreclosures. Premium Filters are about what&#039;s underneath the category. 39 premium data fields* — auction dates, opening bids, trustee and case details, mortgage terms, lender information, investment-property signals, and more. Two-thirds of them are financial-intent data: the fields that tell you why a property is about to move, not just that it&#039;s on a list. That&#039;s the difference between a list of 4,000 pre-foreclosures and a list of 40 with auctions in the next 21 days. *Premium Filters are included with Pro. Exports built to your spec The new export wizard puts you in control of exactly who lands in the file and exactly what travels with them. Choose your list type. Property List, Contact List, Email List, or Phone List. Email and phone lists are included with Pro, along with expanded contact audiences — reach Owners + Family, Residents, or Renters instead of just the owner of record. Filter the contacts before anything leaves. Require a phone number. Require an email address. Take mobile numbers only, or landlines only. Scrub DNC numbers so contacts without a reachable number never make it into the file at all. Choose your fields. Turn individual data points on and off until the export matches the tool it&#039;s headed for — your dialer, your CRM, your mail house — instead of a dump you clean up on the other side. AI Chat, sitting on top of your data Ask for what you want in plain English. &quot;Find absentee owners in Naperville with high equity and no mortgage.&quot; &quot;Who owns this property and how do I reach them?&quot; &quot;Run comps on this address.&quot; DealMachine&#039;s AI searches properties, looks up people, runs comps, and enriches contacts — autonomously, using your live data. Attach a specific list, search, or property to the conversation with @Add Context so it knows exactly what you&#039;re working on. Every conversation is saved and picks up right where you left it. This isn&#039;t a chatbot bolted onto a sidebar. It&#039;s a research assistant with hands on the product. A new mobile app, built for driving for dollars The rebuilt DealMachine mobile app is a driving companion designed for the phone in the mount, not the laptop on the desk. Free Drive puts you on the road with nothing in your way. Open the app, start driving your market, and tag distressed properties the moment you spot them. Search freely as you go, pull up ownership and contact data on any house on the block, and keep moving. Everything you capture on the road lands in the same system your web lists, exports, and mail campaigns run on. Drive in the morning, mail in the afternoon. Connect DealMachine to the AI you already use Looking to empower an AI assistant? Now you can connect it to your DealMachine account. Ask it to find the absentee owners in a market you&#039;re working. Ask who owns an address and how to reach them. Ask it to run comps. It answers from your live DealMachine data, on your account, instead of you stopping to go do it in the app and paste the results back. To set it up using your AI app, install the DealMachine CLI and sign in: npm install -g dealmachine dm login You sign in through your browser — there&#039;s no key to copy anywhere. That login is what gives your AI assistant access to your account. The same tool works on its own, too: search properties, look up people, and pull contact data without opening the app. Documentation at api.docs.dealmachine.com. Built for teams Rebuilt organization and profile settings, with real role controls. Admins own billing and org configuration. Members manage their own profiles and belong to as many organizations as their work requires — and switch between them cleanly on web and mobile. Mail, connected to everything Send postcards and letters in every supported size and orientation, from the same lists you just built. Open the new DealMachine →"/><meta name="twitter:card" content="summary"><meta name="twitter:site" content="&#64;releasenotesio"><meta property="twitter:domain" content="updates.dealmachine.com"><meta property="twitter:url" content="https://updates.dealmachine.com/release/Q2tOZ-1600-release-7272026"><meta name="twitter:title" content="16.0.0 Release 7/27/2026"/><meta name="twitter:description" content="This is the biggest release in DealMachine&#039;s history. We didn&#039;t update DealMachine. We rebuilt it. A new web app. A new mobile app built for the driver&#039;s seat. An AI that works your data alongside you. And a way to connect your account to the AI tools you already use. Everything you&#039;re about to read went live today. Search as many markets as you want The location limit is gone. Add as many locations to a search as your strategy calls for, and mix types freely — everything you add combines into one search area. States, counties, cities, and ZIP codes. Type the name of the place you work — &quot;Indiana,&quot; &quot;Naperville,&quot; &quot;Orange County&quot; — and your results are scoped to its real boundaries. Or draw it yourself. When a market doesn&#039;t line up with any boundary on the map, draw the area by hand and search inside it. Layer any filter set on top and build the list you meant to build in the first place. Premium Filters: go deep, not just wide Anyone can filter for pre-foreclosures. Premium Filters are about what&#039;s underneath the category. 39 premium data fields* — auction dates, opening bids, trustee and case details, mortgage terms, lender information, investment- let-500\/20:focus { --tw-ring-color: rgba(20, 184, 166, 0.20) !important; }.via-violet-400\/70 { --tw-gradient-to: rgba(45, 212, 191, 0) !important; --tw-gradient-stops: var(--tw-gradient-from), rgba(45, 212, 191, 0.7), var(--tw-gradient-to) !important;}/* Raw arbitrary values: ambient glows + timeline dot ring */[class*="radial-gradient"] { background-image: radial-gradient(circle at top, rgba(13, 148, 136, 0.18), transparent 42%) !important;}.dark [class*="radial-gradient"] { background-image: radial-gradient(circle at top, rgba(20, 184, 166, 0.24), transparent 42%) !important;}.pulse-release-summary__dot { box-shadow: 0 0 0 5px rgba(20, 184, 166, 0.12) !important; }.dark .pulse-release-summary__dot { box-shadow: 0 0 0 5px rgba(20, 184, 166, 0.20) !important; }/* Code blocks: hold size down and keep inline-code chips out of <pre> */.release-styles pre code { font-size: 0.9375rem; background-color: transparent; color: inherit; border-radius: 0; padding: 0;} </style> <script> window.context = { project: { name: "DealMachine", logo: "https://release-assets.s3.amazonaws.com/profiles/SXuto7zV2tiyayUgZDfidBdl1TlcVsgxcHjiH2qN.png", darkLogo: "https://release-assets.s3.amazonaws.com/profiles/Kz1brroNtbIpb9XHL7p4Cir0bkaOJcGTB6Rli3xY.png", allowSubscribers: false, team: [ { name: "David Lecko", avatar: "", link: "https://www.gravatar.com/avatar/9d8903f1b8f8cf67c5bdb9f1b44f5c63.jpg?s=200&amp;d=mm" }, { name: "Dave Oster", avatar: "", link: "https://release-assets.s3.amazonaws.com/profiles/amxud28vmuvhpiyz9UHFSerU5sThhcyz4SCQTyK8.jpeg" }, { name: "Nate Dunlevy", avatar: "", link: "https://www.gravatar.com/avatar/e22e32b2aac1de72916355d4aa5ad6fa.jpg?s=200&amp;d=mm" }, { name: "Hannah", avatar: "", link: "https://www.gravatar.com/avatar/d7ff85f1f65006950661ac035d353e46.jpg?s=200&amp;d=mm" }, { name: "Dan Regan", avatar: "", link: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png" }, ] }, loggedIn: false, ssoUrl: "", uid: "Q2tOZ",release: { uid: "Q2tOZ", title: "16.0.0 Release 7\/27\/2026", type: "update", link: "https://updates.dealmachine.com/release/Q2tOZ-1600-release-7272026", private: false, viewable: true, reactions: false, featured_image: "", social_image: "", description: "<h1>This is the biggest release in DealMachine's history.<\/h1>\n<p>We didn't update DealMachine. We rebuilt it. A new web app. A new mobile app built for the driver's seat. An AI that works your data alongside you. And a way to connect your account to the AI tools you already use.<\/p>\n<p>Everything you're about to read went live today.<\/p>\n<h2>Search as many markets as you want<\/h2>\n<p><strong>The location limit is gone.<\/strong> Add as many locations to a search as your strategy calls for, and mix types freely &mdash; everything you add combines into one search area.<\/p>\n<p><strong>States, counties, cities, and ZIP codes.<\/strong> Type the name of the place you work &mdash; \"Indiana,\" \"Naperville,\" \"Orange County\" &mdash; and your results are scoped to its real boundaries.<\/p>\n<p><strong>Or draw it yourself.<\/strong> When a market doesn't line up with any boundary on the map, draw the area by hand and search inside it.<\/p>\n<p>Layer any filter set on top and build the list you meant to build in the first place.<\/p>\n<h2>Premium Filters: go deep, not just wide<\/h2>\n<p>Anyone can filter for pre-foreclosures. <strong>Premium Filters<\/strong> are about what's underneath the category.<\/p>\n<p><strong>39 premium data fields*<\/strong> &mdash; auction dates, opening bids, trustee and case details, mortgage terms, lender information, investment-property signals, and more. Two-thirds of them are financial-intent data: the fields that tell you <em>why<\/em> a property is about to move, not just that it's on a list.<\/p>\n<p>That's the difference between a list of 4,000 pre-foreclosures and a list of 40 with auctions in the next 21 days.<\/p>\n<p><em>*Premium Filters are included with Pro.<\/em><\/p>\n<h2>Exports built to your spec<\/h2>\n<p>The new export wizard puts you in control of exactly who lands in the file and exactly what travels with them.<\/p>\n<p><strong>Choose your list type.<\/strong> Property List, Contact List, Email List, or Phone List. Email and phone lists are included with <strong>Pro<\/strong>, along with expanded contact audiences &mdash; reach <strong>Owners + Family<\/strong>, <strong>Residents<\/strong>, or <strong>Renters<\/strong> instead of just the owner of record.<\/p>\n<p><strong>Filter the contacts before anything leaves.<\/strong> Require a phone number. Require an email address. Take mobile numbers only, or landlines only. Scrub DNC numbers so contacts without a reachable number never make it into the file at all.<\/p>\n<p><strong>Choose your fields.<\/strong> Turn individual data points on and off until the export matches the tool it's headed for &mdash; your dialer, your CRM, your mail house &mdash; instead of a dump you clean up on the other side.<\/p>\n<h2>AI Chat, sitting on top of your data<\/h2>\n<p>Ask for what you want in plain English.<\/p>\n<blockquote>\n<p><em>\"Find absentee owners in Naperville with high equity and no mortgage.\" \"Who owns this property and how do I reach them?\" \"Run comps on this address.\"<\/em><\/p>\n<\/blockquote>\n<p>DealMachine's AI searches properties, looks up people, runs comps, and enriches contacts &mdash; autonomously, using your live data. Attach a specific list, search, or property to the conversation with <strong>@Add Context<\/strong> so it knows exactly what you're working on. Every conversation is saved and picks up right where you left it.<\/p>\n<p>This isn't a chatbot bolted onto a sidebar. It's a research assistant with hands on the product.<\/p>\n<h2>A new mobile app, built for driving for dollars<\/h2>\n<p>The rebuilt DealMachine mobile app is a <strong>driving companion<\/strong> designed for the phone in the mount, not the laptop on the desk.<\/p>\n<p><strong>Free Drive<\/strong> puts you on the road with nothing in your way. Open the app, start driving your market, and tag distressed properties the moment you spot them. Search freely as you go, pull up ownership and contact data on any house on the block, and keep moving.<\/p>\n<p>Everything you capture on the road lands in the same system your web lists, exports, and mail campaigns run on. Drive in the morning, mail in the afternoon.<\/p>\n<h2>Connect DealMachine to the AI you already use<\/h2>\n<p>Looking to empower an AI assistant? Now you can connect it to your DealMachine account.<\/p>\n<p>Ask it to find the absentee owners in a market you're working. Ask who owns an address and how to reach them. Ask it to run comps. It answers from your live DealMachine data, on your account, instead of you stopping to go do it in the app and paste the results back.<\/p>\n<p>To set it up using your AI app, install the DealMachine CLI and sign in:<\/p>\n<pre><code>npm&#32;install&#32;-g&#32;dealmachine\ndm&#32;login<\/code><\/pre>\n<p>You sign in through your browser &mdash; there's no key to copy anywhere. That login is what gives your AI assistant access to your account.<\/p>\n<p>The same tool works on its own, too: search properties, look up people, and pull contact data without opening the app. Documentation at <strong><a href=\"https:\/\/api.docs.dealmachine.com\">api.docs.dealmachine.com<\/a><\/strong>.<\/p>\n<h2>Built for teams<\/h2>\n<p>Rebuilt organization and profile settings, with real role controls. Admins own billing and org configuration. Members manage their own profiles and belong to as many organizations as their work requires &mdash; and switch between them cleanly on web and mobile.<\/p>\n<h2>Mail, connected to everything<\/h2>\n<p>Send postcards and letters in every supported size and orientation, from the same lists you just built.<\/p>\n<p><strong><a href=\"https:\/\/dealmachine.com\/\">Open the new DealMachine &rarr;<\/a><\/strong><\/p>", released_at: "July 28th, 2026", released_at_human: "2 months ago", tags: [ ], owner: { name: "Dan Regan", link: "//updates.dealmachine.com/staff/dan-regan-BQxqX", avatar: "https://release-assets.s3.amazonaws.com//home/forge/app.releasenotes.io/releases/20240822210926/storage/app/public/profiles/ZHJNWYMgJVRlccdYc48mwTNRoMsiTcB3CbywDv8R.png"}, involved: [ ], notes: [ ]} }; </script></head><body> <div id="page-html"></div> <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KZ9N2KPC" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript> <script async src="https://www.googletagmanager.com/gtag/js?id=G-3K1WG1CC4G"></script><script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); var path = window.location.pathname; var fullpath = '/dealmachine/' + window.location.hostname + path; var analytics_data = { 'page': fullpath, 'dimension1': 'dealmachine', 'cookie_domain': 'dealmachine.releasenotes.io' }; gtag('set',analytics_data); gtag('config', 'G-3K1WG1CC4G');</script><script> (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){ (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o), m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m) })(window,document,'script','https://www.google-analytics.com/analytics.js','ga'); var path = window.location.pathname; var fullpath = '/dealmachine/' + window.location.hostname + path; var analytics_data = { 'page': fullpath, 'dimension1': 'dealmachine' }; ga('create', 'UA-70779509-2', 'dealmachine.releasenotes.io', 'rn'); ga('rn.set', analytics_data); ga('rn.send', 'pageview');</script><script id="reactions" type="text/x-handlebars-template"> <div x-data="reactions('{{ uid }}')" class="release-reactions release-reactions--themeable md:mb-20 md:rounded p-8 overflow-hidden text-center"> <div x-show="!state" class="releas
